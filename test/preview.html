<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Mubu Mindmap 预览</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6f8fc;
        font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei",
          sans-serif;
      }
      body.theme-dark {
        background: #12151a;
      }
      #root {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      #root > div {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #root .view-content {
        flex: 1 1 auto;
        min-height: 0;
      }
      .view-content {
        display: flex;
        flex-direction: column;
      }
    
    /* 预览用：模拟 Obsidian 的 Modal 定位 */
    .modal-container { position: fixed; inset: 0; background: rgba(15,23,42,.35); display: flex; align-items: flex-start; justify-content: center; z-index: 2000; padding-top: 9vh; }
    .modal { width: min(580px, 92vw); background: var(--mbm-card, #fff); border-radius: 12px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); overflow: hidden; }
  </style>
  </head>
  <body class="theme-light">
    <div id="root"></div>
    <script src="./bundle.js"></script>
  </body>
</html>
